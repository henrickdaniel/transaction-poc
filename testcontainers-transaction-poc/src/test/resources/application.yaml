spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/app_db
    username: spring_user
    password: spring_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

